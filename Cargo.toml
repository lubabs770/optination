[package]
name = "optination"
version = "0.3.0"
edition = "2024"
description = "A cursor theme picker overlay for Hyprland that shows you the cursors"
license = "MIT"
repository = "https://github.com/lubabs770/optination"
readme = "README.md"
keywords = ["hyprland", "cursor", "hyprcursor", "xcursor", "wayland"]
categories = ["command-line-utilities"]

[dependencies]
dirs = "6.0.0"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
md5 = { version = "0.11.0", package = "md-5" }
png = "0.18.1"
rayon = "1.12.0"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcursor = "0.3.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
