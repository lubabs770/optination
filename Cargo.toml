[package]
name = "optination"
version = "0.1.0"
edition = "2024"
description = "A cursor theme picker for Hyprland that shows you the cursors"
license = "MIT"
repository = "https://github.com/lubabs770/optination"
readme = "README.md"
keywords = ["hyprland", "cursor", "hyprcursor", "xcursor", "wayland"]
categories = ["gui"]

[dependencies]
dirs = "6.0.0"
png = "0.18.1"
rayon = "1.12.0"
resvg = { version = "0.48.1", default-features = false }
slint = "1.17"
xcursor = "0.3.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
