name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Smoke test the CLI
        run: |
          bin=./target/release/optination
          $bin --help
          $bin --version
          # The runner image may or may not ship cursor themes; either way the
          # listings must exit cleanly with well-formed output.
          $bin --list
          $bin --list --json | jq -e 'type == "array"'
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" $bin --thumbs --json | jq -e 'type == "array"'
          $bin --stale --json | jq -e 'has("path")'

      - name: Smoke test rendering against a real theme
        run: |
          # Adwaita is on the runner image today; install it in case that changes.
          dpkg -s adwaita-icon-theme >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends adwaita-icon-theme
          }
          export XDG_CACHE_HOME="$RUNNER_TEMP/cache"
          bin=./target/release/optination
          $bin --list --json | jq -e 'map(.name) | index("Adwaita")'
          $bin --render Adwaita 32 --json | tee render.json | jq -e '.[0].slot == "pointer" and (.[0].path | test("\\.png$"))'
          file "$(jq -r '.[0].path' render.json)" | grep -q 'PNG image data'

      - name: Bundle
        run: |
          mkdir -p dist/optination
          cp target/release/optination install.sh manifest.json dist/optination/
          cp -r qml share dist/optination/

      - uses: actions/upload-artifact@v4
        with:
          name: optination-linux-x86_64
          path: dist/
          if-no-files-found: error

      # A v* tag publishes the same bundle as a release. The tag must match
      # both version fields, so a release can never ship a mislabelled binary.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          manifest_version=$(jq -r .version manifest.json)
          if [ "$version" != "$cargo_version" ] || [ "$version" != "$manifest_version" ]; then
            echo "tag $GITHUB_REF_NAME vs Cargo.toml $cargo_version vs manifest.json $manifest_version" >&2
            exit 1
          fi
          tar -C dist -czf optination-linux-x86_64.tar.gz optination
          gh release create "$GITHUB_REF_NAME" optination-linux-x86_64.tar.gz \
            --title "optination $GITHUB_REF_NAME" --generate-notes
